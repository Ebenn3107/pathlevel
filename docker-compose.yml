services:
  postgres:
    image: postgres:16-alpine
    container_name: pathlevel-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pathlevel
      POSTGRES_PASSWORD: pathlevel_dev
      POSTGRES_DB: pathlevel
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
