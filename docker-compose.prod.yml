# ── Production Docker Compose ────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or export):
#   POSTGRES_PASSWORD   — Database password
#   JWT_SECRET          — JWT signing key (generate with: openssl rand -hex 32)
#   CORS_ORIGIN         — Frontend URL (e.g. https://pathlevel.example.com)
#
# Optional:
#   POSTGRES_USER       — Default: pathlevel
#   POSTGRES_DB         — Default: pathlevel
#   NODE_ENV            — Default: production
#   BACKEND_PORT        — Default: 4000

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathlevel-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathlevel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-pathlevel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathlevel} -d ${POSTGRES_DB:-pathlevel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: pathlevel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pathlevel}:${POSTGRES_PASSWORD:?error}@postgres:5432/${POSTGRES_DB:-pathlevel}
      JWT_SECRET: ${JWT_SECRET:?error}
      CORS_ORIGIN: ${CORS_ORIGIN:?error}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: pathlevel-ui
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: pathlevel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
